server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vendeze}?useSSL=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 'validate' in production — the schema is created from database/schema.sql,
      # not generated by Hibernate, so there's one source of truth for the DB shape.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [openid, profile, email]
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          # Spring Security has no built-in Apple provider — this registers
          # Apple as a generic OIDC client. Apple also requires a signed
          # client-secret JWT (regenerated periodically, max 6 months
          # validity) instead of a fixed secret; see AppleClientSecretGenerator.
          apple:
            client-id: ${APPLE_CLIENT_ID}
            client-secret: ${APPLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: [openid, name, email]
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize?response_mode=form_post
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

app:
  # TRUE for local/dev testing only — lets the front end log in as any demo
  # user with no password check. Set to false (env DEV_LOGIN_ENABLED=false)
  # before this ever runs anywhere public.
  dev-login-enabled: ${DEV_LOGIN_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:}            # must be set in production — 256-bit minimum
    expiry-minutes: 1440               # 24h
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
